name: Restore release candidate
description: Download and verify the immutable stable release candidate.
inputs:
  version:
    description: Release version without the v prefix.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-candidate-${{ inputs.version }}
        path: candidate
    - shell: bash
      run: |
        set -euo pipefail
        archive="candidate/release-candidate-${{ inputs.version }}.tar.gz"
        "${{ github.action_path }}/../../scripts/restore-release-candidate.sh" \
          rstream stable "${{ inputs.version }}" "$archive"
