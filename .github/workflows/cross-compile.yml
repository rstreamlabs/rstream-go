name: build, package and deploy

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
env:
  CHANNEL: "${{ github.ref_type == 'tag' && 'stable' || 'dev' }}"
  NPM_PACKAGE_NAME: "rstream-cli"
  PACKAGE_NAME: "rstream"
  RSTREAM_URL: "${{ github.ref_type == 'tag' && 'https://rstream.io' || 'https://dev.rstream.io' }}"
  VERSION: "${{ github.ref_name }}"
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR && (github.ref_type == 'tag' || github.ref_name == 'main') }}
    runs-on: ["self-hosted", "Linux"]
    steps:
      - shell: bash
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt-get install -y \
            coreutils         \
            dpkg              \
            gawk              \
            git               \
            make              \
            npm               \
            protobuf-compiler \
            rsync             \
            tar               \
            wget              \
            zip
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update && sudo apt-get install -y nuget
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == stable || "$VERSION" == main ]]; then
            make -j "$(getconf _NPROCESSORS_ONLN)" cross
          else
            make -j "$(getconf _NPROCESSORS_ONLN)"
          fi
      - name: Sign macos binaries
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          APPLE_CODESIGN_VERSION: "0.29.0"
          APPLE_CODESIGN_SHA256_X86_64: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
          APPLE_CODESIGN_SHA256_AARCH64: "4af92c87ddf52f5f2d1258a3b4e56c7dcb8f1b2468df744976c5f139e031961f"
          MACOS_APP_STORE_API_KEY: ${{ secrets.MACOS_APP_STORE_API_KEY }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          set -euo pipefail
          if ! command -v rcodesign >/dev/null 2>&1 || [ "$(rcodesign --version | grep -o '[0-9.]*')" != "$APPLE_CODESIGN_VERSION" ]; then
            echo "Installing apple-codesign ${APPLE_CODESIGN_VERSION}"
            pushd /tmp
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              ARCHIVE="apple-codesign-${APPLE_CODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              EXPECTED_SHA256="$APPLE_CODESIGN_SHA256_X86_64"
            elif [ "$ARCH" = "aarch64" ]; then
              ARCHIVE="apple-codesign-${APPLE_CODESIGN_VERSION}-aarch64-unknown-linux-musl.tar.gz"
              EXPECTED_SHA256="$APPLE_CODESIGN_SHA256_AARCH64"
            else
              echo "unsupported architecture: $ARCH" >&2
              exit 1
            fi
            wget -O "$ARCHIVE" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/${ARCHIVE}"
            echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -
            tar -zxvf "$ARCHIVE"
            sudo install -m 0755 "apple-codesign-${APPLE_CODESIGN_VERSION}-${ARCH}-unknown-linux-musl/rcodesign" /usr/local/bin/rcodesign
            popd
          fi
          make -j "$(getconf _NPROCESSORS_ONLN)" "${PACKAGE_NAME}-macos-rcodesign"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: ${{ github.ref_type == 'tag' }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ github.ref_type == 'tag' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ github.ref_type == 'tag' }}
        with:
          username: rstream
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Package and deploy binaries
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          APTLY_DIGEST: ${{ secrets.APTLY_DIGEST }}
          APTLY_URL: "https://aptly.rstream.io"
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: "https://nexus.rstream.io/repository/windows/"
          RSTREAM_TOKEN: ${{ secrets.RSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          make -j "$(getconf _NPROCESSORS_ONLN)" "${PACKAGE_NAME}-deploy-pkg-cross" "${PACKAGE_NAME}-deploy-deb" "${PACKAGE_NAME}-deploy-nupkg" "${PACKAGE_NAME}-docker"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          repository: rstreamlabs/homebrew
          token: ${{ secrets.GIT_TOKEN }}
          path: homebrew
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          repository: rstreamlabs/winget
          token: ${{ secrets.GIT_TOKEN }}
          path: winget
      - name: Update homebrew cask file
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          formula_suffix=""
          if [[ "$CHANNEL" != "stable" ]]; then
            formula_suffix="-dev"
          fi
          BREW_FORMULA="homebrew/Formula/${PACKAGE_NAME}${formula_suffix}.rb"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$BREW_FORMULA"
          PLATFORMS=("macos/x86_64" "macos/arm64" "linux/x86_64" "linux/arm64")
          for PLATFORM in "${PLATFORMS[@]}"; do
            OS=$(echo "$PLATFORM" | cut -d '/' -f1)
            ARCH=$(echo "$PLATFORM" | cut -d '/' -f2)
            FILEPATH="out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/${OS}/${ARCH}/${PACKAGE_NAME}-${VERSION}-${OS}-${ARCH}.tar.gz.info"
            PACKAGE_ID=$(grep "id:" "$FILEPATH" | cut -d ':' -f2 | xargs)
            PACKAGE_URL="${RSTREAM_URL}/api/packages/${PACKAGE_ID}/download"
            CHECKSUM=$(grep "checksum:" "$FILEPATH" | cut -d ':' -f2 | xargs)
            gawk -i inplace -v os="${OS}" -v arch="${ARCH}" -v url="${PACKAGE_URL}" -v sha256="${CHECKSUM}" 'BEGIN{in_os=in_arch=0} /^  on_macos do$/ {in_os=(os=="macos"); in_arch=0} /^  on_linux do$/ {in_os=(os=="linux"); in_arch=0} in_os && /^    if Hardware::CPU\.intel\?$/ {in_arch=(arch=="x86_64")} in_os && /^    else$/ {in_arch=(arch=="arm64")} in_os && in_arch && /url "/ {gsub(/url ".*/, "url \"" url "\"")} in_os && in_arch && /sha256 "/ {gsub(/sha256 ".*/, "sha256 \"" sha256 "\"")} in_os && /^    end$/ {in_arch=0} in_os && /^  end$/ {in_os=in_arch=0} {print}' "$BREW_FORMULA"
          done
          git -C homebrew config user.name 'CI automation'
          git -C homebrew config user.email 'ci@rstream.io'
          git -C homebrew add "Formula/${PACKAGE_NAME}${formula_suffix}.rb"
          git -C homebrew commit -m "update ${PACKAGE_NAME}${formula_suffix} formula to ${VERSION}"
          git -C homebrew push
      - name: Update winget manifests
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          X64_FILEPATH="out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/windows/x86_64/${PACKAGE_NAME}-${VERSION}-windows-x86_64.zip.info"
          ARM64_FILEPATH="out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/windows/arm64/${PACKAGE_NAME}-${VERSION}-windows-arm64.zip.info"
          X64_PACKAGE_ID=$(grep "id:" "$X64_FILEPATH" | cut -d ':' -f2 | xargs)
          X64_PACKAGE_URL="${RSTREAM_URL}/api/packages/${X64_PACKAGE_ID}/download"
          X64_CHECKSUM=$(grep "checksum:" "$X64_FILEPATH" | cut -d ':' -f2 | xargs)
          ARM64_PACKAGE_ID=$(grep "id:" "$ARM64_FILEPATH" | cut -d ':' -f2 | xargs)
          ARM64_PACKAGE_URL="${RSTREAM_URL}/api/packages/${ARM64_PACKAGE_ID}/download"
          ARM64_CHECKSUM=$(grep "checksum:" "$ARM64_FILEPATH" | cut -d ':' -f2 | xargs)
          ./.github/scripts/write-winget-manifests.sh winget "$VERSION" "$X64_PACKAGE_URL" "$X64_CHECKSUM" "$ARM64_PACKAGE_URL" "$ARM64_CHECKSUM"
          git -C winget config user.name 'CI automation'
          git -C winget config user.email 'ci@rstream.io'
          git -C winget add "manifests/r/rstream/rstream/${VERSION}"
          if ! git -C winget diff --cached --quiet; then
            git -C winget commit -m "add ${PACKAGE_NAME} winget manifests for ${VERSION}"
            git -C winget push
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          repository: rstreamlabs/npm
          token: ${{ secrets.GIT_TOKEN }}
          path: npm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish NPM package
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_JSON="npm/${NPM_PACKAGE_NAME}/package.json"
          sed -i "s|\"version\": \".*\"|\"version\": \"${VERSION}\"|" "$PACKAGE_JSON"
          sed -i "s|\"registry\": \".*\"|\"registry\": \"${RSTREAM_URL}\"|" "$PACKAGE_JSON"
          git -C npm config user.name 'CI automation'
          git -C npm config user.email 'ci@rstream.io'
          git -C npm add "${NPM_PACKAGE_NAME}/package.json"
          git -C npm commit -m "update ${NPM_PACKAGE_NAME} version to ${VERSION}"
          git -C npm push
          cd "./npm/${NPM_PACKAGE_NAME}"
          npm install --ignore-scripts
          npm publish
