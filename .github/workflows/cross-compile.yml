name: build release candidates

on:
  push:
    branches:
      - main
    tags:
      - "v*"
env:
  CHANNEL: "${{ github.ref_type == 'tag' && 'stable' || 'dev' }}"
  PACKAGE_NAME: "rstream"
  RSTREAM_CROSS_BUILD_JOBS: "2"
  VERSION: "${{ github.ref_name }}"
permissions:
  actions: read
  contents: read
jobs:
  build-macos:
    name: macOS native binaries (${{ matrix.artifact }})
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR && github.ref_type == 'tag' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platforms: "macos/x86_64 macos/x86_64_v2 macos/x86_64_v3 macos/x86_64_v4"
            artifact: macos-x86_64
          - runner: macos-15
            platforms: "macos/arm64"
            artifact: macos-arm64
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Print Go version
        shell: bash
        run: go version
      - name: Install protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
      - name: Build macOS binaries with native credential backends
        shell: bash
        run: |
          set -euo pipefail
          make -j "$(sysctl -n hw.ncpu)" PLATFORMS="${{ matrix.platforms }}" "${PACKAGE_NAME}-cross"
          mkdir -p artifact
          rsync -a "out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/macos" artifact/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          if-no-files-found: error
          retention-days: 1
  build:
    name: ${{ github.ref_type == 'tag' && 'build and sign stable release candidate' || 'build development targets' }}
    needs: build-macos
    if: ${{ always() && github.actor == vars.CI_ALLOWED_ACTOR && (github.ref_type == 'tag' || github.ref_name == 'main') && (github.ref_type != 'tag' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt-get install -y \
            coreutils         \
            dpkg              \
            gawk              \
            git               \
            jq                \
            make              \
            npm               \
            protobuf-compiler \
            rsync             \
            tar               \
            wget              \
            zip
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update && sudo apt-get install -y nuget
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.ref_type == 'tag' }}
        with:
          repository: rstreamlabs/npm
          path: npm
          persist-credentials: false
      - name: Print Go version
        shell: bash
        run: go version
      - name: Free runner disk space
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
          sudo docker system prune -af >/dev/null || true
      - name: Build non-macOS targets
        shell: bash
        run: |
          set -euo pipefail
          trap 'df -h / /tmp' ERR
          if [[ "$CHANNEL" == stable ]]; then
            for target in freebsd-cross linux-cross netbsd-cross openbsd-cross windows-cross; do
              make -j "$RSTREAM_CROSS_BUILD_JOBS" "$target"
              go clean -cache
              rm -rf "${GOTMPDIR:-/tmp}"/go-build*
            done
          else
            make -j "$(getconf _NPROCESSORS_ONLN)"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.ref_type == 'tag' }}
        with:
          pattern: macos-*
          path: native-macos-artifacts
      - name: Install native macOS artifacts
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          destination="out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}"
          mkdir -p "${destination}/macos"
          shopt -s nullglob
          artifact_dirs=(native-macos-artifacts/macos-*)
          if ((${#artifact_dirs[@]} == 0)); then
            echo "no native macOS artifacts were downloaded" >&2
            exit 1
          fi
          for artifact_dir in "${artifact_dirs[@]}"; do
            if [[ ! -d "${artifact_dir}/macos" ]]; then
              echo "native macOS artifact is missing macos directory: ${artifact_dir}" >&2
              find "${artifact_dir}" -maxdepth 4 -print >&2
              exit 1
            fi
            rsync -a "${artifact_dir}/macos/" "${destination}/macos/"
          done
          find "${destination}/macos" -path "*/release/bin/${PACKAGE_NAME}" -type f -exec chmod 0755 {} +
      - name: Verify native macOS artifacts
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for platform in macos/arm64 macos/x86_64 macos/x86_64_v2 macos/x86_64_v3 macos/x86_64_v4; do
            binary="out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/${platform}/release/bin/${PACKAGE_NAME}"
            if [[ ! -x "${binary}" ]]; then
              echo "missing or non-executable native macOS binary: ${binary}" >&2
              missing=1
            fi
          done
          if ((missing)); then
            find "out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/macos" -maxdepth 5 -print >&2 || true
            exit 1
          fi
      - name: Sign macos binaries
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          APPLE_CODESIGN_VERSION: "0.29.0"
          APPLE_CODESIGN_SHA256_X86_64: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
          APPLE_CODESIGN_SHA256_AARCH64: "4af92c87ddf52f5f2d1258a3b4e56c7dcb8f1b2468df744976c5f139e031961f"
          MACOS_APP_STORE_API_KEY: ${{ secrets.MACOS_APP_STORE_API_KEY }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          set -euo pipefail
          if ! command -v rcodesign >/dev/null 2>&1 || [ "$(rcodesign --version | grep -o '[0-9.]*')" != "$APPLE_CODESIGN_VERSION" ]; then
            echo "Installing apple-codesign ${APPLE_CODESIGN_VERSION}"
            pushd /tmp
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              ARCHIVE="apple-codesign-${APPLE_CODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              EXPECTED_SHA256="$APPLE_CODESIGN_SHA256_X86_64"
            elif [ "$ARCH" = "aarch64" ]; then
              ARCHIVE="apple-codesign-${APPLE_CODESIGN_VERSION}-aarch64-unknown-linux-musl.tar.gz"
              EXPECTED_SHA256="$APPLE_CODESIGN_SHA256_AARCH64"
            else
              echo "unsupported architecture: $ARCH" >&2
              exit 1
            fi
            wget -O "$ARCHIVE" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/${ARCHIVE}"
            echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -
            tar -zxvf "$ARCHIVE"
            sudo install -m 0755 "apple-codesign-${APPLE_CODESIGN_VERSION}-${ARCH}-unknown-linux-musl/rcodesign" /usr/local/bin/rcodesign
            popd
          fi
          make -j "$(getconf _NPROCESSORS_ONLN)" "${PACKAGE_NAME}-macos-rcodesign"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: ${{ github.ref_type == 'tag' }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ github.ref_type == 'tag' }}
      - name: Package stable release candidate
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          make -j "$(getconf _NPROCESSORS_ONLN)" \
            "${PACKAGE_NAME}-pkg-cross" \
            "${PACKAGE_NAME}-deb-cross" \
            "${PACKAGE_NAME}-nupkg"
          docker_archive="${PWD}/out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/${PACKAGE_NAME}-${VERSION}-docker.oci.tar"
          make -j "$(getconf _NPROCESSORS_ONLN)" \
            DOCKER_REPO="docker.io/rstream" \
            DOCKER_OUTPUT="type=oci,dest=${docker_archive}" \
            "${PACKAGE_NAME}-docker"
          ./.github/scripts/create-npm-candidate.sh \
            npm/rstream-cli "$VERSION" https://rstream.io \
            "out/cmd/${PACKAGE_NAME}/${CHANNEL}/${VERSION}/npm"
          go clean -cache
          rm -rf npm/rstream-cli/node_modules
          rm -rf native-macos-artifacts
          docker builder prune --all --force >/dev/null
          archive="release-candidate-${VERSION}.tar.gz"
          ./.github/scripts/create-release-candidate.sh \
            "$PACKAGE_NAME" "$CHANNEL" "$VERSION" "$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.ref_type == 'tag' }}
        with:
          name: release-candidate-${{ env.VERSION }}
          path: |
            release-candidate-${{ env.VERSION }}.tar.gz
            release-candidate-${{ env.VERSION }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
