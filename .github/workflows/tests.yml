name: tests
on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  filesystem-platforms:
    name: filesystem behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Rooted filesystem, WebRTC, streaming, HTTP and embedded UI
        run: go test -count=1 ./filesystem/... ./fileserver/...
      - name: Actual CLI and MCP file transfers across both backends
        run: go test -count=1 ./cmd/rstream/cmd -run '^TestFilesystem(CLIAndMCPBackendMatrix|WebRTCThroughCLIAndMCP|WebRTCPreparedContextAvoidsControlPlane)$'
  fast:
    name: format, generate, vet, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ github.token }}
      - name: Install protobuf generator
        shell: bash
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go' ':!:*.pb.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Check generated protobuf
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code -- '*.pb.go'
      - name: Vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Staticcheck
        run: staticcheck ./...
      - name: Build runtime test binaries
        run: make test-bins
      - name: Test runtime harness helpers
        run: ./test/e2e/runtime-common-unit.sh
      - name: Test release package retry policy
        run: ./test/release-package-retries.sh
      - name: Test private release repository access
        run: ./test/release-private-repository-access.sh
      - name: Test draft release lookup
        run: ./test/release-draft-lookup.sh
      - name: Test release candidate run validation
        run: ./test/release-candidate-run-validation.sh
      - name: Test release candidate round trip
        run: ./test/release-candidate.sh
      - name: Test Docker release publication
        run: ./test/release-docker-image.sh
      - name: Validate release automation
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/*.sh test/release-*.sh
          shellcheck .github/scripts/*.sh test/release-*.sh
          jq empty release-please-config.json .release-please-manifest.json server.json
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage="${RUNNER_TEMP}/coverage.out"
          go test -shuffle=on -count=1 -coverprofile="${coverage}" ./...
          total="$(go tool cover -func="${coverage}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          printf 'Total coverage: %s%%\n' "${total}"
          if ! awk -v total="${total}" 'BEGIN {exit total < 54.0}'; then
            printf 'Coverage %s%% is below the 54.0%% floor.\n' "${total}" >&2
            exit 1
          fi
  fips:
    name: FIPS profile tests and Linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet strict profile
        run: go vet -tags=rstream_fips ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Staticcheck strict profile
        run: staticcheck -tags rstream_fips ./...
      - name: Run strict profile tests and build supported artifacts
        run: make CHANNEL=stable VERSION=0.0.0-test fips-test fips-release-assets
      - name: Verify executable profile cannot be disabled
        shell: bash
        run: |
          set -euo pipefail
          binary=out/fips/linux/x86_64/rstream
          "$binary" --version | grep -F 'v1.0.0-c2097c7c'
          if GODEBUG=fips140=off "$binary" --version; then
            echo 'FIPS artifact accepted an explicit runtime downgrade' >&2
            exit 1
          fi
          for checksum in out/cmd/rstream/stable/0.0.0-test/fips/*.sha256; do
            (cd "$(dirname "$checksum")" && shasum -a 256 --check "$(basename "$checksum")")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rstream-fips-${{ github.sha }}
          path: out/cmd/rstream/stable/0.0.0-test/fips
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  race:
    name: race and lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REPEAT: ${{ github.event_name == 'schedule' && '10' || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count="${REPEAT}" ./...
  windows-stdin-race:
    name: Windows stdin race and lifecycle tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test native Windows stdin with the race detector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=8 -run '^TestRunWebTTYClientCaptureForwardsExternalProcessPipe$' ./cmd/rstream/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $env:CGO_ENABLED = '1'
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW is required for the Windows race detector' }
          go test -race -count=1 -run '^(TestWindowsStdinReader.*|TestRunClientWindows(StdinLifecycle|TerminalGeometry)|TestRunWebTTYClientCaptureForwards(PipedStdin|ExternalProcessPipe))$' ./webtty ./cmd/rstream/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-assembly-network-diagnostic:
    name: Exact release assembly Windows diagnostic
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == vars.CI_ALLOWED_ACTOR &&
      github.head_ref == 'codex/webtty-windows-pipe-diagnostic'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI_ALLOWED_ACTOR: ${{ vars.CI_ALLOWED_ACTOR }}
    steps:
      - name: Checkout exact certification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-engine
          ref: ca66b6d49995091258ae7320b0c8f4e988db5e59
          token: ${{ secrets.GIT_TOKEN }}
          path: policy
          persist-credentials: false
      - name: Checkout exact Go source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c14ca32d0f4e9b4e7ed809722726350ed10ed849
          path: sources/rstream-go
          persist-credentials: false
      - name: Checkout exact Engine runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-engine
          ref: 1906e460ebf917dc1a334ddde2f5198129b2561c
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-engine
          persist-credentials: false
      - name: Checkout exact C++ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          ref: b15b4063fd0b7b5982540c7bab596578b9b73edc
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-cpp
          persist-credentials: false
      - name: Checkout exact JavaScript source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-js
          ref: 0071efad393b0b199a49b62a8209e416661911b0
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-js
          persist-credentials: false
      - name: Checkout exact Next.js source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-nextjs
          ref: 9213c356f7cd127ba5cdcd95290cf682362f8031
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-nextjs
          persist-credentials: false
      - name: Checkout the previous Go release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-go
          ref: c91b25410993a3fa194075ce57d3ee473474568f # v1.31.0
          path: baseline/rstream-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sources/rstream-go/go.mod
          cache-dependency-path: |
            sources/rstream-go/go.sum
            sources/rstream-engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare native Windows runtime prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $openssl 'openssl.exe'))) {
            throw 'The native OpenSSL test prerequisite is missing'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $openssl
          $assembly = @{
            engine = '1906e460ebf917dc1a334ddde2f5198129b2561c'
            go = 'c14ca32d0f4e9b4e7ed809722726350ed10ed849'
            cpp = 'b15b4063fd0b7b5982540c7bab596578b9b73edc'
            js = '0071efad393b0b199a49b62a8209e416661911b0'
            nextjs = '9213c356f7cd127ba5cdcd95290cf682362f8031'
          }
          [IO.File]::WriteAllText(
            (Join-Path $pwd 'assembly.json'),
            ($assembly | ConvertTo-Json -Compress)
          )
      - name: Verify native Windows process ownership and command execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python policy/test/e2e/test_webtty_windows_processes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python policy/test/e2e/test_webtty_runtime_command.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the authenticated C++ candidate proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: rstreamlabs/rstream-engine
          run-id: '36231563530'
          name: webtty-cpp-candidates-d6ef132cc08e7108835b11552417337422a833f0ff7b931e54cba70b8844ff4c-1
          github-token: ${{ secrets.GIT_TOKEN }}
          path: cpp-candidate-proof
      - name: Download the exact C++ release runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          run-id: '36221251298'
          name: cpp-release-candidate-b15b4063fd0b7b5982540c7bab596578b9b73edc-windows-x86_64
          github-token: ${{ secrets.GIT_TOKEN }}
          path: cpp-candidate
      - name: Build the exact release assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python policy/test/e2e/webtty_assembly.py --assembly assembly.json --source-root sources --legacy-go-repo baseline/rstream-go --cpp-candidate-dir cpp-candidate --cpp-candidate-proof cpp-candidate-proof/cpp-candidates.json --output-dir build --jobs 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release executables start with their authenticated runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          build/cpp-candidate/bin/rstream-webtty-client.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/cpp-candidate/bin/rstream-webtty-server.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the exact release runtime
        id: exact_runtime
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python policy/test/e2e/webtty_assembly_runtime.py --assembly assembly.json --source-root sources --build-dir build --output-dir runtime --jobs 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-release-windows-runtime-${{ github.sha }}
          path: |
            assembly.json
            build/build.json
            build/windows-go-runtime.log
            runtime/evidence/
            runtime/*.log
            runtime/*.stderr.log
            runtime/**/*.log
            runtime/**/*.stderr.log
            runtime/*/manifest.json
            runtime/*/results.json
            runtime/*/results.junit.xml
          if-no-files-found: error
          retention-days: 30
      - name: Require the exact release runtime
        if: always() && steps.exact_runtime.outcome != 'success'
        shell: pwsh
        run: throw 'The exact release Windows runtime failed'
  webtty-runtime:
    name: WebTTY Go direct profile (partial coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run WebTTY CLI workflows
        env:
          RSTREAM_KEEP_RUNTIME: "1"
        run: ./test/e2e/webtty-cli-workflows.sh
      - name: Validate WebTTY runtime coverage and deadline guards
        run: python3 -m unittest discover -s test/e2e -p 'test_*.py'
      - name: Run WebTTY Go direct profile
        env:
          RSTREAM_KEEP_RUNTIME: "1"
          RSTREAM_WEBTTY_RUNTIME_PROFILE: go-direct
        run: ./test/e2e/webtty-runtime-matrix.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webtty-runtime-logs
          path: |
            ${{ runner.temp }}/rstream-webtty-cli.*
            ${{ runner.temp }}/rstream-webtty-runtime.*
          if-no-files-found: ignore
          retention-days: 7
