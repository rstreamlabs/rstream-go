name: tests
on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  filesystem-platforms:
    name: filesystem behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Rooted filesystem, WebRTC, streaming, HTTP and embedded UI
        run: go test -count=1 ./filesystem/... ./fileserver/...
      - name: Actual CLI and MCP file transfers across both backends
        run: go test -count=1 ./cmd/rstream/cmd -run '^TestFilesystem(CLIAndMCPBackendMatrix|WebRTCThroughCLIAndMCP|WebRTCPreparedContextAvoidsControlPlane)$'
  fast:
    name: format, generate, vet, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ github.token }}
      - name: Install protobuf generator
        shell: bash
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go' ':!:*.pb.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Check generated protobuf
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code -- '*.pb.go'
      - name: Vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Staticcheck
        run: staticcheck ./...
      - name: Build runtime test binaries
        run: make test-bins
      - name: Test runtime harness helpers
        run: ./test/e2e/runtime-common-unit.sh
      - name: Test release package retry policy
        run: ./test/release-package-retries.sh
      - name: Test private release repository access
        run: ./test/release-private-repository-access.sh
      - name: Test draft release lookup
        run: ./test/release-draft-lookup.sh
      - name: Test release candidate run validation
        run: ./test/release-candidate-run-validation.sh
      - name: Test release candidate round trip
        run: ./test/release-candidate.sh
      - name: Test Docker release publication
        run: ./test/release-docker-image.sh
      - name: Validate release automation
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/*.sh test/release-*.sh
          shellcheck .github/scripts/*.sh test/release-*.sh
          jq empty release-please-config.json .release-please-manifest.json server.json
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage="${RUNNER_TEMP}/coverage.out"
          go test -shuffle=on -count=1 -coverprofile="${coverage}" ./...
          total="$(go tool cover -func="${coverage}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          printf 'Total coverage: %s%%\n' "${total}"
          if ! awk -v total="${total}" 'BEGIN {exit total < 54.0}'; then
            printf 'Coverage %s%% is below the 54.0%% floor.\n' "${total}" >&2
            exit 1
          fi
  fips:
    name: FIPS profile tests and Linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet strict profile
        run: go vet -tags=rstream_fips ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Staticcheck strict profile
        run: staticcheck -tags rstream_fips ./...
      - name: Run strict profile tests and build supported artifacts
        run: make CHANNEL=stable VERSION=0.0.0-test fips-test fips-release-assets
      - name: Verify executable profile cannot be disabled
        shell: bash
        run: |
          set -euo pipefail
          binary=out/fips/linux/x86_64/rstream
          "$binary" --version | grep -F 'v1.0.0-c2097c7c'
          if GODEBUG=fips140=off "$binary" --version; then
            echo 'FIPS artifact accepted an explicit runtime downgrade' >&2
            exit 1
          fi
          for checksum in out/cmd/rstream/stable/0.0.0-test/fips/*.sha256; do
            (cd "$(dirname "$checksum")" && shasum -a 256 --check "$(basename "$checksum")")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rstream-fips-${{ github.sha }}
          path: out/cmd/rstream/stable/0.0.0-test/fips
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  race:
    name: race and lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REPEAT: ${{ github.event_name == 'schedule' && '10' || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count="${REPEAT}" ./...
  windows-stdin-race:
    name: Windows stdin race and lifecycle tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test native Windows stdin with the race detector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=8 -run '^TestRunWebTTYClientCaptureForwardsExternalProcessPipe$' ./cmd/rstream/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $env:CGO_ENABLED = '1'
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW is required for the Windows race detector' }
          go test -race -count=1 -run '^(TestWindowsStdinReader.*|TestRunClientWindows(StdinLifecycle|TerminalGeometry)|TestRunWebTTYClientCaptureForwards(PipedStdin|ExternalProcessPipe))$' ./webtty ./cmd/rstream/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build-patched-cpp-windows:
    name: Build patched C++ Windows candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == vars.CI_ALLOWED_ACTOR &&
      github.head_ref == 'codex/webtty-windows-pipe-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONAN_VERSION: "2.31.2"
      LLVM_MINGW_VERSION: "20260616"
    steps:
      - name: Checkout patched C++ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          ref: 6494bf88ceee95f9bdb2707e7fd5e3d7efa09527
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-cpp
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install cross-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache cmake jq libdigest-sha-perl nasm ninja-build pipx pkg-config xz-utils
          pipx install "conan==${CONAN_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          host_arch=$(dpkg --print-architecture)
          case "${host_arch}" in
            amd64) llvm_mingw_host_arch=x86_64 ;;
            arm64) llvm_mingw_host_arch=aarch64 ;;
            *) echo "unsupported host architecture: ${host_arch}" >&2; exit 1 ;;
          esac
          llvm_mingw_dir="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-${llvm_mingw_host_arch}"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-${llvm_mingw_host_arch}.tar.xz" | sudo tar -xJf - -C /opt
          sudo ln -sfn "${llvm_mingw_dir}" /opt/llvm-mingw
          echo "/opt/llvm-mingw/bin" >> "${GITHUB_PATH}"
      - name: Restore exact qualified C++ dependency cache
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          gh run download 36119690618 --repo rstreamlabs/rstream-cpp --name cpp-release-candidate-505545d4b32faf38c23f9bad83fb6e14809b4cf1-windows-x86_64 --dir cpp-base-candidate
          (cd cpp-base-candidate/conan && shasum -a 256 -c SHA256SUMS)
          conan profile detect -f
          conan config install sources/rstream-cpp/conan/config
          conan cache restore cpp-base-candidate/conan/cache.tgz
      - name: Build patched x86_64 Windows package
        shell: bash
        env:
          CHANNEL: stable
          EXPORT_PACKAGE_NAME: rstream-utils
          OSS: windows
          USE_DOCKER: "off"
          USE_PATCHED_CONAN_DEPS: "on"
          WINDOWS_ARCHS: x86_64
          WINDOWS_BUILD_SHARED: "off"
        run: |
          set -euo pipefail
          sources/rstream-cpp/build-conan-cross.sh
          package=$(find sources/rstream-cpp/out/release -type f -path '*/windows/x86_64/static/packages/rstream-utils.zip' -print -quit)
          test -n "${package}"
          mkdir -p patched-cpp
          unzip -q "${package}" -d patched-cpp
          test -f patched-cpp/bin/rstream-webtty-client.exe
          test -f patched-cpp/bin/rstream-webtty-server.exe
          (cd patched-cpp && sha256sum bin/rstream-webtty-client.exe bin/rstream-webtty-server.exe > SHA256SUMS)
          printf '%s\n' '6494bf88ceee95f9bdb2707e7fd5e3d7efa09527' > patched-cpp/SOURCE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-cpp-windows-6494bf88ceee95f9bdb2707e7fd5e3d7efa09527
          path: patched-cpp
          if-no-files-found: error
          retention-days: 7

  windows-assembly-network-diagnostic:
    name: Patched assembly Windows network diagnostic
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == vars.CI_ALLOWED_ACTOR &&
      github.head_ref == 'codex/webtty-windows-pipe-diagnostic'
    needs: build-patched-cpp-windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact Go source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c14ca32d0f4e9b4e7ed809722726350ed10ed849
          path: sources/rstream-go
          persist-credentials: false
      - name: Checkout exact Engine source and certification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-engine
          ref: 1906e460ebf917dc1a334ddde2f5198129b2561c
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-engine
          persist-credentials: false
      - name: Checkout exact C++ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          ref: 6494bf88ceee95f9bdb2707e7fd5e3d7efa09527
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-cpp
          persist-credentials: false
      - name: Checkout exact JavaScript source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-js
          ref: 0071efad393b0b199a49b62a8209e416661911b0
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-js
          persist-credentials: false
      - name: Checkout exact Next.js source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-nextjs
          ref: 9213c356f7cd127ba5cdcd95290cf682362f8031
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-nextjs
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sources/rstream-go/go.mod
          cache-dependency-path: |
            sources/rstream-go/go.sum
            sources/rstream-engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the exact Go and Engine binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Push-Location sources/rstream-go
          go build -trimpath -o ../../build/go.exe ./cmd/rstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location sources/rstream-engine
          go build -trimpath -tags 'ee,http2legacy' -o ../../build/engine.exe ./cmd/rstream-engine-ee
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patched-cpp-windows-6494bf88ceee95f9bdb2707e7fd5e3d7efa09527
          path: cpp-candidate
      - name: Verify the patched C++ binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content -Raw cpp-candidate/SOURCE).Trim() -ne '6494bf88ceee95f9bdb2707e7fd5e3d7efa09527') {
            throw 'C++ candidate metadata differs from the selected source'
          }
          Push-Location cpp-candidate
          $checksums = Get-Content SHA256SUMS
          foreach ($line in $checksums) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid C++ candidate checksum: $line" }
            $actual = (Get-FileHash -Algorithm SHA256 $Matches[2]).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "C++ candidate checksum mismatch: $($Matches[2])" }
          }
          Pop-Location
          $client = @(Get-ChildItem cpp-candidate -Recurse -Filter rstream-webtty-client.exe)
          $server = @(Get-ChildItem cpp-candidate -Recurse -Filter rstream-webtty-server.exe)
          if ($client.Count -ne 1 -or $server.Count -ne 1) { throw 'expected exactly one C++ WebTTY client and server' }
          "CPP_CLIENT=$($client[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CPP_SERVER=$($server[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute the exact Windows Engine route matrix serially
        id: exact_matrix
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sources/rstream-engine/test/e2e/webtty_network_matrix.py --output-dir windows-network --jobs 1 --engine-repo sources/rstream-engine --go-repo sources/rstream-go --cpp-repo sources/rstream-cpp --js-repo sources/rstream-js --nextjs-repo sources/rstream-nextjs --engine-bin build/engine.exe --go-bin build/go.exe --cpp-client-bin $env:CPP_CLIENT --cpp-server-bin $env:CPP_SERVER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stress exact C++ short-lived child completion through Engine
        id: cpp_completion_stress
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path windows-cpp-completion-stress | Out-Null
          $failures = @()
          foreach ($networkCase in @('auto-quic', 'auto-tls')) {
            foreach ($iteration in 1..48) {
              $output = "windows-cpp-completion-stress/$networkCase-$iteration"
              python sources/rstream-engine/test/e2e/webtty_native_fixture.py --output-dir $output --engine-bin build/engine.exe --go-bin build/go.exe --cpp-client-bin $env:CPP_CLIENT --cpp-server-bin $env:CPP_SERVER --cpp-server --private --no-discovery --by-id --network-case $networkCase
              if ($LASTEXITCODE -ne 0) {
                $failures += "$networkCase-$iteration"
              }
            }
          }
          $summary = @{
            expected = 96
            executed = 96
            failures = $failures
            passed = $failures.Count -eq 0
          }
          $summary | ConvertTo-Json | Set-Content -Encoding utf8 windows-cpp-completion-stress/results.json
          if ($failures.Count -ne 0) {
            throw "C++ completion stress failed $($failures.Count)/96 times: $($failures -join ', ')"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-assembly-windows-network-${{ github.sha }}
          path: |
            windows-network
            windows-cpp-completion-stress
          if-no-files-found: error
          retention-days: 30
      - name: Require the serial matrix
        if: always() && steps.exact_matrix.outcome != 'success'
        shell: pwsh
        run: throw 'The exact serial Windows Engine route matrix failed'
  webtty-runtime:
    name: WebTTY Go direct profile (partial coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run WebTTY CLI workflows
        env:
          RSTREAM_KEEP_RUNTIME: "1"
        run: ./test/e2e/webtty-cli-workflows.sh
      - name: Validate WebTTY runtime coverage and deadline guards
        run: python3 -m unittest discover -s test/e2e -p 'test_*.py'
      - name: Run WebTTY Go direct profile
        env:
          RSTREAM_KEEP_RUNTIME: "1"
          RSTREAM_WEBTTY_RUNTIME_PROFILE: go-direct
        run: ./test/e2e/webtty-runtime-matrix.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webtty-runtime-logs
          path: |
            ${{ runner.temp }}/rstream-webtty-cli.*
            ${{ runner.temp }}/rstream-webtty-runtime.*
          if-no-files-found: ignore
          retention-days: 7
