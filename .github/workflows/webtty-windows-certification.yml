name: Public Windows release evidence

on:
  workflow_dispatch:
    inputs:
      assembly:
        description: JSON object containing the exact engine, go, cpp, js and nextjs source revisions
        required: true
        type: string
      engine_policy_sha:
        description: Current rstream-engine main commit containing the certification policy
        required: true
        type: string
      cpp_candidate_run_id:
        description: Protected C++ release candidate run containing the exact Windows runtime
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: webtty-public-windows-evidence
  cancel-in-progress: false

jobs:
  windows-evidence:
    name: Exact release assembly on public Windows
    if: github.actor == vars.CI_ALLOWED_ACTOR && github.triggering_actor == vars.CI_ALLOWED_ACTOR && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI_ALLOWED_ACTOR: ${{ vars.CI_ALLOWED_ACTOR }}
      ASSEMBLY_JSON: ${{ inputs.assembly }}
    steps:
      - name: Require the current Engine main certification policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
          ENGINE_POLICY_SHA: ${{ inputs.engine_policy_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (gh api repos/rstreamlabs/rstream-engine/commits/main --jq .sha).Trim()
          if ($actual -ne $env:ENGINE_POLICY_SHA) {
            throw "Engine policy $($env:ENGINE_POLICY_SHA) is not current main $actual"
          }
      - name: Checkout exact certification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-engine
          ref: ${{ inputs.engine_policy_sha }}
          token: ${{ secrets.GIT_TOKEN }}
          path: policy
          persist-credentials: false
      - name: Checkout exact Go source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.assembly).go }}
          path: sources/rstream-go
          persist-credentials: false
      - name: Checkout exact Engine runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-engine
          ref: ${{ fromJSON(inputs.assembly).engine }}
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-engine
          persist-credentials: false
      - name: Checkout exact C++ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          ref: ${{ fromJSON(inputs.assembly).cpp }}
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-cpp
          persist-credentials: false
      - name: Checkout exact JavaScript source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-js
          ref: ${{ fromJSON(inputs.assembly).js }}
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-js
          persist-credentials: false
      - name: Checkout exact Next.js source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-nextjs
          ref: ${{ fromJSON(inputs.assembly).nextjs }}
          token: ${{ secrets.GIT_TOKEN }}
          path: sources/rstream-nextjs
          persist-credentials: false
      - name: Checkout the previous Go release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rstreamlabs/rstream-go
          ref: c91b25410993a3fa194075ce57d3ee473474568f # v1.31.0
          path: baseline/rstream-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sources/rstream-go/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate and bind the immutable release assembly
        id: assembly
        shell: bash
        env:
          ENGINE_POLICY_SHA: ${{ inputs.engine_policy_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'policy/test/e2e')
          from webtty_assembly import assembly_id, read_assembly
          path = Path('assembly.json')
          path.write_text(os.environ['ASSEMBLY_JSON'])
          assembly = read_assembly(path)
          identifier = assembly_id(assembly)
          source = {
              'assembly': assembly,
              'assembly_id': identifier,
              'engine_policy_sha': os.environ['ENGINE_POLICY_SHA'],
              'workflow_sha': os.environ['GITHUB_SHA'],
          }
          Path('windows-evidence-source.json').write_text(
              json.dumps(source, indent=2) + '\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('id=' + identifier + '\n')
          PY
      - name: Prepare native Windows runtime prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $openssl 'openssl.exe'))) {
            throw 'The native OpenSSL test prerequisite is missing'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $openssl
      - name: Verify native Windows process ownership and command execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python policy/test/e2e/test_webtty_windows_processes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python policy/test/e2e/test_webtty_runtime_command.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate the exact C++ release candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
          CPP_CANDIDATE_RUN_ID: ${{ inputs.cpp_candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          python policy/test/e2e/webtty_cpp_candidate.py --assembly assembly.json --run-id $env:CPP_CANDIDATE_RUN_ID --output cpp-candidates.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the exact C++ Windows release runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: rstreamlabs/rstream-cpp
          run-id: ${{ inputs.cpp_candidate_run_id }}
          name: cpp-release-candidate-${{ fromJSON(inputs.assembly).cpp }}-windows-x86_64
          github-token: ${{ secrets.GIT_TOKEN }}
          path: cpp-candidate
      - name: Build the exact release assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_ACTIONS = 'false'
          python policy/test/e2e/webtty_assembly.py --assembly assembly.json --source-root sources --legacy-go-repo baseline/rstream-go --cpp-candidate-dir cpp-candidate --cpp-candidate-proof cpp-candidates.json --output-dir build --jobs 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release executables start with their authenticated runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          build/cpp-candidate/bin/rstream-webtty-client.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/cpp-candidate/bin/rstream-webtty-server.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the exact release runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_ACTIONS = 'false'
          python policy/test/e2e/webtty_assembly_runtime.py --assembly assembly.json --source-root sources --build-dir build --output-dir runtime --jobs 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve authenticated Windows evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webtty-windows-evidence-${{ steps.assembly.outputs.id }}-${{ github.run_attempt }}
          path: |
            assembly.json
            windows-evidence-source.json
            build/build.json
            build/windows-go-runtime.log
            runtime/evidence/
            runtime/*.log
            runtime/*.stderr.log
            runtime/**/*.log
            runtime/**/*.stderr.log
            runtime/*/manifest.json
            runtime/*/results.json
            runtime/*/results.junit.xml
          if-no-files-found: error
          retention-days: 90
